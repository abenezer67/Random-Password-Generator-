<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="outer-container">
        <h1>Random <br> <span>password </span>Generator</h1>
        <div class="inner-container">
            <div class="password-box">
                <input type="text" id="RandPassword" placeholder="Password">
                <img src="images/copy-solid-full.svg" alt="Copy password" class="copy-icon" onclick="copyPassword()">
            </div>

            <div class="length-field">
  <label for="length">Please choose Password length</label>
  <input  type="number" id="length" min="8" max="64" value="16" inputmode="numeric">
  <small>Choose between 8 and 64 characters</small>
</div>
            <button onclick="createPassword()"><img src="images/rotate-right-solid-full.svg" alt="">Generate Password</button>

        </div>



        
        
    </div>
    <script src = "logic.js"></script>
</body>
</html>
